// Opt-in observer for the same ordinary Flutter release build. It does not
// change dependency selection, packaging, signing, or the stable release gate.
import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.api.artifacts.result.UnresolvedDependencyResult
import org.gradle.maven.MavenModule
import org.gradle.maven.MavenPomArtifact

def destination = System.getenv('EXVPN_DEMO_MAVEN_GRAPH')
if (!destination) return
def record = { File file ->
    if (!file.isFile() || file.length() < 1) throw new GradleException('demo_maven_input_missing')
    def digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = stream.read(buffer)) > 0) digest.update(buffer, 0, count)
    }
    [file: file.canonicalPath, name: file.name, size: file.length(), sha256: digest.digest().encodeHex().toString()]
}
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null || !app.plugins.hasPlugin('com.android.application')) return
    app.tasks.named('assembleRelease').configure {
        doLast {
            def target = new File(destination)
            if (target.exists()) throw new GradleException('demo_maven_graph_not_fresh')
            def config = app.configurations.getByName('releaseRuntimeClasspath')
            def resolution = config.incoming.resolutionResult
            if (resolution.allDependencies.any { it instanceof UnresolvedDependencyResult }) {
                throw new GradleException('demo_maven_unresolved_dependency')
            }
            def modules = resolution.allComponents.findAll { it.id instanceof ModuleComponentIdentifier }
            def nodes = modules.collectEntries { component ->
                def id = component.id
                if (id.version.contains('+') || id.version.contains('SNAPSHOT')) {
                    throw new GradleException('demo_maven_version_not_exact')
                }
                [(id): [id: 'maven:' + id.group + ':' + id.module + ':' + id.version, artifacts: [], pom: null]]
            }
            config.incoming.artifactView {
                componentFilter { !(it instanceof ProjectComponentIdentifier) }
                lenient = false
            }.artifacts.artifacts.each { artifact ->
                def id = artifact.id.componentIdentifier
                if (!(id instanceof ModuleComponentIdentifier) || !nodes.containsKey(id) ||
                    !(artifact.file.name.endsWith('.aar') || artifact.file.name.endsWith('.jar'))) {
                    throw new GradleException('demo_maven_unknown_artifact')
                }
                nodes[id].artifacts.add(record(artifact.file))
            }
            def query = app.dependencies.createArtifactResolutionQuery().forComponents(modules.collect { it.id })
                .withArtifacts(MavenModule, MavenPomArtifact).execute()
            if (query.components.size() != query.resolvedComponents.size()) {
                throw new GradleException('demo_maven_pom_unresolved')
            }
            query.resolvedComponents.each { component ->
                def poms = component.getArtifacts(MavenPomArtifact)
                if (poms.size() != 1 || !(poms.first() instanceof ResolvedArtifactResult)) {
                    throw new GradleException('demo_maven_pom_missing')
                }
                nodes[component.id].pom = record(poms.first().file)
            }
            if (nodes.values().any { it.pom == null }) throw new GradleException('demo_maven_pom_missing')
            nodes.values().each { it.artifacts = it.artifacts.unique { item -> item.sha256 + '/' + item.name }.sort { it.name } }
            target.parentFile.mkdirs()
            target.setText(JsonOutput.prettyPrint(JsonOutput.toJson([
                schema: 1, status: 'RESOLVED_DEMO_RELEASE_INPUTS', variant: 'release',
                configuration: config.name, gradleVersion: gradle.gradleVersion,
                projectComponentCount: resolution.allComponents.count { it.id instanceof ProjectComponentIdentifier },
                components: nodes.values().sort { it.id },
                postR8InventoryComplete: false
            ])) + '\n', 'UTF-8')
            println "ExVPN demo Maven input evidence: ${nodes.size()} exact components. Post-R8 inventory is not asserted."
        }
    }
}
