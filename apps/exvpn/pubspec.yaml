name: exvpn
description: ExVPN cross-platform client interface.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  exvpn_domain:
    path: ../../packages/exvpn_domain
  exvpn_client_state:
    path: ../../packages/exvpn_client_state
  http: ^1.5.0
  cupertino_icons: ^1.0.8
  flutter_secure_storage: 11.2.0
  ffi: 2.2.0
  path_provider: 2.1.6
  win32: 6.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/flags/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
