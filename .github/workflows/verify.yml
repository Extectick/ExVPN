name: ExVPN checks and development builds

on:
  push:
    # Source tags are bound and built by the release workflow. Avoid a second
    # identical Android/Windows build when main and its tag are pushed together.
    branches: ['**']
    tags-ignore: ['**']
    # Documentation-only pushes must not cancel an in-flight native build.
    # Pull requests stay unfiltered so required checks are always reported.
    # GitHub applies this filter to the final diff: such excluded pushes have
    # no new CI/build proof. Per-commit impact checks apply to triggered runs.
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.target }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [Android, Windows]
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      GOTOOLCHAIN: local
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select native build impact (full build on unknown/error)
        id: build_impact
        continue-on-error: true
        run: ./scripts/ci/build-impact.ps1
      - name: Cache pinned SDK archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Archives only: bootstrap rechecks their SHA-256 before extraction.
          # Keep these exact names aligned with toolchain.lock.json.
          path: |
            .tools/downloads/go1.27.2.windows-amd64.zip
            .tools/downloads/flutter_windows_3.47.7-stable.zip
          key: exvpn-sdk-archives-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap/toolchain.lock.json', 'scripts/bootstrap/bootstrap.ps1') }}
          enableCrossOsArchive: false
      - name: Install repository-pinned Flutter and Go
        # Always run, including cache hits; a restored archive is not SDK proof.
        run: ./scripts/bootstrap/bootstrap.ps1
      - name: Cache verified Go dependencies and compiler outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/cache/go/pkg/mod
            .tools/cache/go-build
          # Targets populate different native/race work; do not race to save
          # an incomplete cache under a shared immutable key.
          key: exvpn-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/bootstrap/toolchain.lock.json', 'native/core/go.mod', 'native/core/go.sum', 'native/android/go.mod', 'native/android/go.sum', 'native/windows/go.mod', 'native/windows/go.sum', 'native/patches/xray-lifecycle.lock.json', 'native/patches/xray-lifecycle.patch') }}
          enableCrossOsArchive: false
      - name: Cache locked Pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/cache/pub
          key: exvpn-pub-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap/toolchain.lock.json', 'apps/exvpn/pubspec.lock', 'packages/exvpn_domain/pubspec.lock', 'packages/exvpn_client_state/pubspec.lock', 'packages/exvpn_updates/pubspec.lock') }}
          enableCrossOsArchive: false
      - name: Prepare Android SDK packages on the disposable runner
        if: matrix.target == 'Android'
        env:
          EXVPN_CI_SKIP_NATIVE_BUILD: ${{ steps.build_impact.outcome == 'success' && steps.build_impact.outputs.skip_native_build == 'true' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:JAVA_HOME_21_X64) { throw 'Runner JDK 21 is missing.' }
          "JAVA_HOME=$env:JAVA_HOME_21_X64" >> $env:GITHUB_ENV
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          if (!$env:ANDROID_HOME) { throw 'Runner Android SDK is missing.' }
          # GitHub's Android SDK image includes accepted SDK license files.
          # Do not auto-answer new license prompts or change a developer host.
          if (!(Test-Path -LiteralPath (Join-Path $env:ANDROID_HOME 'licenses/android-sdk-license'))) {
            throw 'The runner has no Android SDK license; use a prepared runner.'
          }
          $sdkManager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          # JVM tests still compile Flutter/plugin dependencies with SDK + NDK
          # 28. Only the separate ExVPN JNI build requires NDK 27.
          $packages = @('platforms;android-36', 'build-tools;36.0.0', 'ndk;28.2.13676358')
          if ($env:EXVPN_CI_SKIP_NATIVE_BUILD -cne 'true') { $packages += 'ndk;27.1.12297006' }
          & $sdkManager @packages
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Android packages could not be installed.' }
      - name: Analyze, test, and build
        # Cache hits never skip version/revision, lockfile, module verification
        # or tests. verify.ps1 keeps Go test -count=1 and -mod=readonly.
        env:
          EXVPN_CI_SKIP_NATIVE_BUILD: ${{ steps.build_impact.outcome == 'success' && steps.build_impact.outputs.skip_native_build == 'true' }}
          EXVPN_CI_TARGET: ${{ matrix.target }}
        run: ./scripts/ci/verify.ps1 -Target $env:EXVPN_CI_TARGET -SkipNativeBuild:($env:EXVPN_CI_SKIP_NATIVE_BUILD -ceq 'true')
      - name: Upload Android development APK
        if: matrix.target == 'Android' && (steps.build_impact.outcome != 'success' || steps.build_impact.outputs.skip_native_build != 'true')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: exvpn-android-debug-${{ github.sha }}
          path: apps/exvpn/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload Windows development bundle
        if: matrix.target == 'Windows' && (steps.build_impact.outcome != 'success' || steps.build_impact.outputs.skip_native_build != 'true')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: exvpn-windows-debug-${{ github.sha }}
          path: |
            apps/exvpn/build/windows/x64/runner/Debug/
            artifacts/windows/exvpn-service.exe
            artifacts/windows/wintun.dll
            artifacts/windows/Wintun-LICENSE.txt
          if-no-files-found: error
          retention-days: 7
