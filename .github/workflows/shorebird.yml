name: ExVPN signed Shorebird beta

on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [base, patch, rollback, diagnose, diagnose_android, recover_base]
        required: true
      version:
        description: Exact base SemVer+build; patches never change it
        type: string
        required: true
      publish_cloud:
        description: Explicitly publish to Shorebird; false validates only
        type: boolean
        default: false
      base_run_id:
        description: Successful base workflow run ID (patch/rollback)
        type: string
      base_source_commit:
        description: Reviewed exact base source SHA (patch/rollback)
        type: string
      patch_target:
        description: Patch platform; select only the failed platform after partial success
        type: choice
        options: [Both, Android, Windows]
        default: Both
      android_patch_number:
        description: Actual Android patch number (rollback only)
        type: string
      windows_patch_number:
        description: Actual Windows patch number (rollback only; may differ)
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: exvpn-shorebird-beta
  cancel-in-progress: false

jobs:
  deliver:
    if: github.repository == 'Extectick/ExVPN' && github.ref == 'refs/heads/main' && inputs.operation != 'rollback' && inputs.operation != 'diagnose_android'
    name: Shorebird ${{ inputs.operation }} ${{ matrix.target }}
    runs-on: windows-2025
    environment: demo-release
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.operation == 'diagnose' && '["Windows"]' || inputs.operation == 'patch' && inputs.patch_target == 'Android' && '["Android"]' || inputs.operation == 'patch' && inputs.patch_target == 'Windows' && '["Windows"]' || '["Android","Windows"]') }}
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      GOTOOLCHAIN: local
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
      EXVPN_OPERATION: ${{ inputs.operation }}
      EXVPN_VERSION: ${{ inputs.version }}
      EXVPN_PUBLISH: ${{ inputs.publish_cloud }}
      EXVPN_BASE_SHA: ${{ inputs.base_source_commit }}
      EXVPN_BASE_RUN_ID: ${{ inputs.base_run_id }}
      EXVPN_PATCH_TARGET: ${{ inputs.patch_target }}
      EXVPN_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate explicit identity and source
        run: |
          if ($env:EXVPN_VERSION -cnotmatch '^\d+\.\d+\.\d+\+[1-9]\d*$') { throw 'shorebird_version_invalid' }
          if ($env:EXVPN_OPERATION -ceq 'patch' -and ($env:EXVPN_BASE_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:EXVPN_BASE_RUN_ID -cnotmatch '^[1-9][0-9]*$')) { throw 'shorebird_base_source_invalid' }
          if ($env:EXVPN_OPERATION -ceq 'patch' -and $env:EXVPN_PATCH_TARGET -cnotin @('Both','Android','Windows')) { throw 'shorebird_patch_target_invalid' }
          if ($env:EXVPN_OPERATION -ceq 'recover_base' -and ($env:EXVPN_VERSION -cne '0.1.8+29' -or $env:EXVPN_PUBLISH -cne 'true')) { throw 'shorebird_recovery_version_mismatch' }
      - name: Guard exact patch source before tool preparation
        if: inputs.operation == 'patch'
        run: |
          . ./scripts/release/flutter-runtime-inputs.ps1
          . ./scripts/release/shorebird-pipeline-lib.ps1
          $null=Assert-ShorebirdPatchSource (Get-Location).Path $env:EXVPN_BASE_SHA
      - name: Prove recovery changes only packaging before SDK or native builds
        if: inputs.operation == 'recover_base'
        run: |
          . ./scripts/release/flutter-runtime-inputs.ps1
          . ./scripts/release/shorebird-pipeline-lib.ps1
          $repository=(Get-Location).Path
          $source=Get-ShorebirdSourceCommit $repository
          try { $null = Assert-ShorebirdRecoverySource $repository $source }
          catch {
            $null=Write-ShorebirdRecovery -Repository $repository -Action base -Version $env:EXVPN_VERSION -Target $env:EXVPN_TARGET -SourceCommit $source -Status failed -CloudOutcome unknown -Phase cloud_recovery -Subphase recovery_equivalence -ErrorCode (Get-ShorebirdSafeFailureCode $_.Exception.Message) -FailureLeaf (Get-ShorebirdSafeFailureLeaf $_.InvocationInfo.ScriptName) -FailureLine $_.InvocationInfo.ScriptLineNumber
            throw 'shorebird_recovery_equivalence_failed'
          }
          Write-Host 'Recovery compiled-source equivalence PASS.'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/downloads/go1.27.2.windows-amd64.zip
            .tools/downloads/flutter_windows_3.47.7-stable.zip
            .tools/cache/pub
            .tools/cache/shorebird-pub
            .tools/cache/go/pkg/mod
            .tools/cache/go-build
            .tools/cache/native-outputs-v1
          key: exvpn-shorebird-inputs-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('scripts/bootstrap/*.lock.json', 'apps/exvpn/pubspec.lock', 'native/**/go.sum') }}-${{ hashFiles('native/**', 'scripts/core/**', 'scripts/bootstrap/**', 'scripts/build/**', 'scripts/windows/build.ps1') }}
          restore-keys: exvpn-shorebird-inputs-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('scripts/bootstrap/*.lock.json', 'apps/exvpn/pubspec.lock', 'native/**/go.sum') }}-
      - name: Cache exact Shorebird checkout and SDK (verified after restore)
        id: target-sdk
        if: inputs.operation != 'diagnose'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/shorebird-1.6.129
          key: exvpn-shorebird-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('scripts/bootstrap/shorebird.lock.json') }}
      - name: Restore exact Windows SDK for first Android patch cache
        if: inputs.operation == 'patch' && matrix.target == 'Android' && steps.target-sdk.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/shorebird-1.6.129
          key: exvpn-shorebird-sdk-v1-${{ runner.os }}-${{ runner.arch }}-Windows-${{ hashFiles('scripts/bootstrap/shorebird.lock.json') }}
      - name: Prepare pinned ordinary tools and Android inputs
        run: |
          ./scripts/bootstrap/bootstrap.ps1
          if (!$env:JAVA_HOME_21_X64 -or !$env:ANDROID_HOME) { throw 'shorebird_runner_jdk_sdk_missing' }
          "JAVA_HOME=$env:JAVA_HOME_21_X64" >> $env:GITHUB_ENV
          $env:JAVA_HOME = $env:JAVA_HOME_21_X64
          if ($env:EXVPN_TARGET -ceq 'Android') {
            & (Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat') 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'ndk;27.1.12297006'
            if ($LASTEXITCODE -ne 0) { throw 'shorebird_android_packages_failed' }
          }
          ./scripts/release/prepare-archive-inspector.ps1
      - name: Test pipeline guards without SDK or cloud mutations
        run: ./scripts/release/test-shorebird-pipeline.ps1
      - name: Test isolated Android tool environment guards without builds
        if: matrix.target == 'Android'
        run: ./scripts/release/test-shorebird-android-environment.ps1
      - name: Test exact patch input byte preservation without builds
        if: inputs.operation == 'patch'
        run: ./scripts/release/test-shorebird-patch-inputs.ps1
      - name: Analyze and test the reviewed Dart source
        if: inputs.operation != 'recover_base'
        run: |
          if ($env:EXVPN_OPERATION -cin @('base','diagnose')) {
            ./scripts/ci/verify.ps1 -Target Checks
          } else {
            . ./scripts/release/flutter-runtime-inputs.ps1
            . ./scripts/release/shorebird-pipeline-lib.ps1
            $plan=Get-ShorebirdPatchValidationPlan (Get-Location).Path $env:EXVPN_BASE_SHA
            if($plan.reusedReviewedFull) { Write-Host 'Dart inputs match accepted Full0d9f: 374 app tests / 12 lanes; focused maintenance guards ran separately.' }
            foreach($lane in $plan.lanes) {
              & pwsh -NoProfile -NonInteractive -File ./scripts/qa/run-fast-validation-lane.ps1 -Lane $lane -OnlineDependencies
              if($LASTEXITCODE -ne 0) { throw 'shorebird_patch_dart_validation_failed' }
            }
          }
      - name: Test recovery notice and packaging guards without rebuilding UI
        if: inputs.operation == 'recover_base'
        run: |
          foreach ($test in @('test-shorebird-runtime-notices.ps1','test-notice-inputs.ps1','test-demo-maven-notices.ps1')) {
            & pwsh -NoProfile -File (Join-Path ./scripts/release $test)
            if ($LASTEXITCODE -ne 0) { throw 'shorebird_recovery_notice_guard_failed' }
          }
      - name: Require clean source after Checks
        run: |
          . ./scripts/release/flutter-runtime-inputs.ps1
          . ./scripts/release/shorebird-pipeline-lib.ps1
          $null = Get-ShorebirdSourceCommit (Get-Location).Path -Phase after_checks
      - name: Prepare exact Shorebird CLI and Flutter
        if: inputs.operation != 'diagnose'
        run: ./scripts/release/prepare-shorebird.ps1 -Target $env:EXVPN_TARGET
      - name: Resolve locked app dependencies for patch or recovery from a cold cache
        if: inputs.operation == 'patch' || inputs.operation == 'recover_base'
        run: |
          . ./scripts/release/flutter-runtime-inputs.ps1
          $repository=(Get-Location).Path
          $runtime=Get-ReleaseFlutterRuntime -Repository $repository -Target $env:EXVPN_TARGET -FlutterRuntime shorebird -FlutterBuildMode release
          $flutter=Join-Path $runtime.SdkRoot 'bin/flutter.bat'
          $env:PUB_CACHE=Join-Path $repository '.tools/cache/pub'
          $env:FLUTTER_STORAGE_BASE_URL='https://download.shorebird.dev'
          Push-Location (Join-Path $repository 'apps/exvpn')
          try {
            & $flutter pub get --enforce-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'shorebird_recovery_locked_pub_failed' }
          } finally { Pop-Location }
      - name: Require clean source after SDK before native builds
        if: inputs.operation != 'diagnose'
        run: |
          . ./scripts/release/flutter-runtime-inputs.ps1
          . ./scripts/release/shorebird-pipeline-lib.ps1
          $null = Get-ShorebirdSourceCommit (Get-Location).Path -Phase after_sdk
      - name: Build Android JNI for base only
        if: (inputs.operation == 'base' || inputs.operation == 'recover_base') && matrix.target == 'Android'
        run: ./native/android/build.ps1
      - name: Build Windows service for base only
        if: (inputs.operation == 'base' || inputs.operation == 'recover_base') && matrix.target == 'Windows'
        run: |
          ./scripts/windows/build.ps1
          ./scripts/windows/prepare-wintun.ps1
      - name: Download immutable base receipts and sealed inputs
        if: inputs.operation == 'patch'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: shorebird-base-${{ matrix.target }}-${{ inputs.base_source_commit }}
          path: artifacts/shorebird-base
          run-id: ${{ inputs.base_run_id }}
          github-token: ${{ github.token }}
      - name: Build once and optionally publish signed beta
        if: inputs.operation != 'diagnose'
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          EXVPN_CI_DIAGNOSTICS_PUBLIC_KEY_BASE64: ${{ secrets.EXVPN_CI_DIAGNOSTICS_PUBLIC_KEY_BASE64 }}
          EXVPN_ANDROID_KEYSTORE_BASE64: ${{ matrix.target == 'Android' && secrets.EXVPN_ANDROID_KEYSTORE_BASE64 || '' }}
          EXVPN_ANDROID_STORE_PASSWORD: ${{ matrix.target == 'Android' && secrets.EXVPN_ANDROID_STORE_PASSWORD || '' }}
          EXVPN_ANDROID_KEY_PASSWORD: ${{ matrix.target == 'Android' && secrets.EXVPN_ANDROID_STORE_PASSWORD || '' }}
          EXVPN_ANDROID_KEY_ALIAS: exvpn
          EXVPN_SHOREBIRD_PRIVATE_KEY_BASE64: ${{ inputs.operation == 'patch' && secrets.EXVPN_SHOREBIRD_PRIVATE_KEY_BASE64 || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:SHOREBIRD_TOKEN) { throw 'shorebird_api_key_missing' }
          $keyPath = Join-Path $env:RUNNER_TEMP ('exvpn-shorebird-' + [guid]::NewGuid().ToString('N') + '.p12')
          try {
            if ($env:EXVPN_TARGET -ceq 'Android') {
              if (!$env:EXVPN_ANDROID_KEYSTORE_BASE64 -or !$env:EXVPN_ANDROID_STORE_PASSWORD) { throw 'shorebird_android_signing_missing' }
              [IO.File]::WriteAllBytes($keyPath,[Convert]::FromBase64String($env:EXVPN_ANDROID_KEYSTORE_BASE64))
              $env:EXVPN_ANDROID_KEYSTORE_BASE64 = $null
              $env:EXVPN_ANDROID_KEYSTORE = $keyPath
            }
            . ./scripts/bootstrap/enter-environment.ps1
            $arguments = @{Target=$env:EXVPN_TARGET;ReleaseVersion=$env:EXVPN_VERSION;PublishCloud=($env:EXVPN_PUBLISH -ceq 'true')}
            if ($env:EXVPN_OPERATION -cin @('base','recover_base')) {
              if ($env:EXVPN_OPERATION -ceq 'recover_base' -and $env:EXVPN_TARGET -ceq 'Windows') { $arguments.RecoverWindowsBase = $true }
              $result = ./scripts/release/shorebird-release.ps1 @arguments
            } else {
              if (!$env:EXVPN_SHOREBIRD_PRIVATE_KEY_BASE64) { throw 'shorebird_patch_signing_missing' }
              $receipts = @(Get-ChildItem artifacts/shorebird-base -File -Recurse -Filter build.json)
              if ($receipts.Count -ne 1) { throw 'shorebird_base_receipt_ambiguous' }
              $result = ./scripts/release/shorebird-patch.ps1 @arguments -BaseReceipt $receipts[0].FullName -BaseSourceCommit $env:EXVPN_BASE_SHA
            }
            "EXVPN_SHOREBIRD_OUTPUT=$($result.OutputDirectory)" >> $env:GITHUB_ENV
          } finally {
            $env:EXVPN_ANDROID_KEYSTORE = $null
            $env:EXVPN_ANDROID_STORE_PASSWORD = $null
            $env:EXVPN_ANDROID_KEY_PASSWORD = $null
            $env:EXVPN_SHOREBIRD_PRIVATE_KEY_BASE64 = $null
            if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
          }
      - name: Upload audited artifacts and sanitized receipts only
        if: inputs.operation != 'diagnose'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shorebird-${{ inputs.operation == 'recover_base' && 'base' || inputs.operation }}-${{ matrix.target }}-${{ github.sha }}
          path: ${{ env.EXVPN_SHOREBIRD_OUTPUT }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Preserve sanitized cloud recovery identity even after failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shorebird-recovery-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/shorebird-recovery/*.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve sanitized SDK preparation diagnosis even after failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shorebird-prepare-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/shorebird-prepare/*.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Preserve sanitized source guard diagnosis even after failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shorebird-source-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/shorebird-source/*.json
          if-no-files-found: ignore
          retention-days: 90

  diagnose-android:
    if: github.repository == 'Extectick/ExVPN' && github.ref == 'refs/heads/main' && inputs.operation == 'diagnose_android'
    name: Android exact tool preflight (no application build)
    runs-on: windows-2025
    environment: demo-release
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore existing exact Windows Shorebird SDK without bootstrap or cache save
        id: existing-sdk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/shorebird-1.6.129
          key: exvpn-shorebird-sdk-v1-${{ runner.os }}-${{ runner.arch }}-Windows-${{ hashFiles('scripts/bootstrap/shorebird.lock.json') }}
      - name: Run exact Android preflight and preserve early encrypted diagnosis
        env:
          CI: 'true'
          FLUTTER_SUPPRESS_ANALYTICS: 'true'
          DART_SUPPRESS_ANALYTICS: 'true'
          EXVPN_DIAG_CACHE_HIT: ${{ steps.existing-sdk.outputs.cache-hit }}
          EXVPN_DIAG_VERSION: ${{ inputs.version }}
          EXVPN_DIAG_PUBLISH: ${{ inputs.publish_cloud }}
          EXVPN_CI_DIAGNOSTICS_PUBLIC_KEY_BASE64: ${{ secrets.EXVPN_CI_DIAGNOSTICS_PUBLIC_KEY_BASE64 }}
        run: |
          $ErrorActionPreference='Stop'
          . ./scripts/release/flutter-runtime-inputs.ps1
          . ./scripts/release/shorebird-pipeline-lib.ps1
          . ./scripts/release/shorebird-android-environment.ps1
          $repository=(Get-Location).Path
          $saved=@{}
          foreach($name in @('APPDATA','JAVA_HOME','PATH','PUB_CACHE','GRADLE_USER_HOME','FLUTTER_STORAGE_BASE_URL')) {
            $saved[$name]=[Environment]::GetEnvironmentVariable($name,'Process')
          }
          $private=New-ShorebirdPrivateDirectory $repository 'android-diagnose'
          $pair=Join-Path $private 'diagnose.json'
          $safe=[ordered]@{schemaVersion=1;action='diagnose_android';status='failed';phase='source'
            sourceCommit=$null;sdkCacheHit=($env:EXVPN_DIAG_CACHE_HIT -ceq 'true');sdkCacheTarget='Windows'
            errorCode=$null;diagnosticEncrypted=$false;applicationBuilds=0;nativeBuilds=0;cloudCalls=0}
          try {
            if($env:EXVPN_DIAG_VERSION -cnotmatch '^\d+\.\d+\.\d+\+[1-9]\d*$' -or $env:EXVPN_DIAG_PUBLISH -ceq 'true') { throw 'shorebird_android_diagnose_inputs_invalid' }
            $safe.sourceCommit=Get-ShorebirdSourceCommit $repository
            $safe.phase='cache'
            if(!$safe.sdkCacheHit) { throw 'shorebird_android_diagnose_cache_miss' }
            $safe.phase='runtime'
            $null=Get-ShorebirdCli $repository
            $runtime=Get-ReleaseFlutterRuntime -Repository $repository -Target Windows -FlutterRuntime shorebird -FlutterBuildMode release
            $safe.phase='java'
            if(!$env:JAVA_HOME_21_X64) { throw 'shorebird_android_diagnose_java_missing' }
            $env:JAVA_HOME=$env:JAVA_HOME_21_X64
            $env:PATH=(Join-Path $runtime.SdkRoot 'bin')+[IO.Path]::PathSeparator+$saved.PATH
            $env:PUB_CACHE=Join-Path $repository '.tools/cache/pub'
            $env:GRADLE_USER_HOME=Join-Path $repository '.tools/cache/gradle'
            $env:FLUTTER_STORAGE_BASE_URL='https://download.shorebird.dev'
            $safe.phase='android_sdk'
            $sdk=Resolve-ReleaseAndroidSdkDirectory $env:ANDROID_HOME
            $safe.phase='tool_preflight'
            $null=Initialize-ShorebirdAndroidToolEnvironment -Repository $repository -FlutterSdkRoot $runtime.SdkRoot -AndroidSdkPath $sdk -PrivateDirectory $private
            $safe.status='completed';$safe.phase='complete'
          } catch {
            $safe.errorCode=if($_.Exception.Message -cin @('shorebird_android_diagnose_inputs_invalid','shorebird_android_diagnose_cache_miss','shorebird_android_diagnose_java_missing','shorebird_android_environment_preflight_failed')) { $_.Exception.Message } else { 'shorebird_android_diagnose_failed' }
            $safe|ConvertTo-Json -Depth 4|Set-Content -LiteralPath $pair -Encoding utf8NoBOM
            ($_|Out-String)|Set-Content -LiteralPath ([IO.Path]::ChangeExtension($pair,'.log')) -Encoding utf8NoBOM
            $safe.diagnosticEncrypted=$null -ne (Write-ShorebirdEncryptedDiagnostic $repository $pair)
            throw 'shorebird_android_diagnose_failed'
          } finally {
            foreach($name in $saved.Keys) { [Environment]::SetEnvironmentVariable($name,$saved[$name],'Process') }
            $directory=Join-Path $repository 'artifacts/shorebird-recovery'
            New-Item -ItemType Directory -Path $directory -Force|Out-Null
            Assert-AuditNoLinks $directory
            $safe|ConvertTo-Json -Depth 4|Set-Content -LiteralPath (Join-Path $directory ('android-diagnose-'+[guid]::NewGuid().ToString('N')+'.json')) -Encoding utf8NoBOM
          }
          $global:LASTEXITCODE=0
      - name: Preserve safe receipts and encrypted private tails only
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shorebird-android-diagnose-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/shorebird-recovery/*.json
            artifacts/shorebird-source/*.json
          if-no-files-found: ignore
          retention-days: 90

  rollback:
    if: github.repository == 'Extectick/ExVPN' && github.ref == 'refs/heads/main' && inputs.operation == 'rollback'
    runs-on: windows-2025
    environment: demo-release
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      EXVPN_VERSION: ${{ inputs.version }}
      EXVPN_ANDROID_PATCH_NUMBER: ${{ inputs.android_patch_number }}
      EXVPN_WINDOWS_PATCH_NUMBER: ${{ inputs.windows_patch_number }}
      EXVPN_PUBLISH: ${{ inputs.publish_cloud }}
      EXVPN_BASE_SHA: ${{ inputs.base_source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reuse the exact Windows base cache. Preparation below still verifies
      # all pinned archive hashes, CLI/SDK revisions and runtime identities.
      # Restore only: rollback never writes build caches or stores credentials.
      - name: Restore pinned bootstrap inputs for rollback
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/downloads/go1.27.2.windows-amd64.zip
            .tools/downloads/flutter_windows_3.47.7-stable.zip
            .tools/cache/pub
            .tools/cache/shorebird-pub
            .tools/cache/go/pkg/mod
            .tools/cache/go-build
            .tools/cache/native-outputs-v1
          key: exvpn-shorebird-inputs-v1-${{ runner.os }}-Windows-${{ hashFiles('scripts/bootstrap/*.lock.json', 'apps/exvpn/pubspec.lock', 'native/**/go.sum') }}-${{ hashFiles('native/**', 'scripts/core/**', 'scripts/bootstrap/**', 'scripts/build/**', 'scripts/windows/build.ps1') }}
          restore-keys: exvpn-shorebird-inputs-v1-${{ runner.os }}-Windows-${{ hashFiles('scripts/bootstrap/*.lock.json', 'apps/exvpn/pubspec.lock', 'native/**/go.sum') }}-
      - name: Restore exact Shorebird SDK for rollback
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/shorebird-1.6.129
          key: exvpn-shorebird-sdk-v1-${{ runner.os }}-${{ runner.arch }}-Windows-${{ hashFiles('scripts/bootstrap/shorebird.lock.json') }}
      - name: Download both base receipts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: shorebird-base-*-${{ inputs.base_source_commit }}
          path: artifacts/shorebird-base
          run-id: ${{ inputs.base_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare exact CLI
        run: |
          ./scripts/bootstrap/bootstrap.ps1
          ./scripts/release/prepare-shorebird.ps1 -Target Windows
      - name: Verify or roll back the exact beta patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: |
          if ($env:EXVPN_BASE_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:EXVPN_ANDROID_PATCH_NUMBER -cnotmatch '^[1-9][0-9]*$' -or $env:EXVPN_WINDOWS_PATCH_NUMBER -cnotmatch '^[1-9][0-9]*$') { throw 'shorebird_rollback_identity_invalid' }
          $receipts = @(Get-ChildItem artifacts/shorebird-base -File -Recurse -Filter build.json)
          if ($receipts.Count -ne 2) { throw 'shorebird_rollback_receipts_missing' }
          foreach ($receipt in $receipts) {
            $base = Get-Content -LiteralPath $receipt.FullName -Raw | ConvertFrom-Json
            if ($base.sourceCommit -cne $env:EXVPN_BASE_SHA) { throw 'shorebird_rollback_source_mismatch' }
          }
          $result = ./scripts/release/shorebird-rollback-all.ps1 -ReleaseVersion $env:EXVPN_VERSION -AndroidPatchNumber ([int]$env:EXVPN_ANDROID_PATCH_NUMBER) -WindowsPatchNumber ([int]$env:EXVPN_WINDOWS_PATCH_NUMBER) -BaseReceipts @($receipts.FullName) -PublishCloud:($env:EXVPN_PUBLISH -ceq 'true')
          "EXVPN_SHOREBIRD_OUTPUT=$($result.OutputDirectory)" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: shorebird-rollback-${{ github.run_id }}
          path: ${{ env.EXVPN_SHOREBIRD_OUTPUT }}
          if-no-files-found: error
          retention-days: 90
